<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 92" fill="none">
  <style>
    :root {
      --mm-stroke: #7B6F62;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --mm-stroke: #E8E3DB;
      }
    }
    .mm-circle {
      stroke: var(--mm-stroke);
      stroke-width: 4.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>

  <!-- Mayur Mehta Design Hallmark: 9 Touching Circles (3x3 Grid) -->
  <!-- Row 1 -->
  <circle class="mm-circle" cx="20" cy="20" r="13" />
  <circle class="mm-circle" cx="46" cy="20" r="13" />
  <circle class="mm-circle" cx="72" cy="20" r="13" />

  <!-- Row 2 -->
  <circle class="mm-circle" cx="20" cy="46" r="13" />
  <circle class="mm-circle" cx="46" cy="46" r="13" />
  <circle class="mm-circle" cx="72" cy="46" r="13" />

  <!-- Row 3 -->
  <circle class="mm-circle" cx="20" cy="72" r="13" />
  <circle class="mm-circle" cx="46" cy="72" r="13" />
  <circle class="mm-circle" cx="72" cy="72" r="13" />
</svg>
